<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quiz</title>
    <link rel="stylesheet" href="stylequiz.css">
</head>
<body>

    <h1>🌎 Quiz</h1>
    <div class="quiz"> 
        <h2>Pregunta 1</h2>
        <p>¿En que pais se encuentra el Monumento de la Independencia?</p>

        <label>
            <input type="radio" name="pregunta1" value="a">
            Italia
        </label>

        <label>
            <input type="radio" name="pregunta1" value="b">
            Mexico
        </label>

        <label>
            <input type="radio" name="pregunta1" value="c">
            Japon
        </label>
        
        <h2>Pregunta 2</h2>
        <p>¿Que comida trae como ingrediente una tortilla de harina?</p>

        <label>
            <input type="radio" name="pregunta2" value="a">
            Sushi
        </label>

        <label>
            <input type="radio" name="pregunta2" value="b">
            Tacos
        </label>

        <label>
            <input type="radio" name="pregunta2" value="c">
            Paella
        </label>

        <h2>Pregunta 3</h2>
        <p>¿En que pais se encuentra la Muralla China?</p>

        <label>
            <input type="radio" name="pregunta3" value="a">
            Mexico
        </label>

        <label>
            <input type="radio" name="pregunta3" value="b">
            Italia
        </label>

        <label>
            <input type="radio" name="pregunta3" value="c">
            China
        </label>

        <br><br>

        <button id="botonCorregir">Corregir quiz</button>

        <p id="resultado"></p>
    </div>

    <a href="index.html">Volver a la pagina principal</a>

    <script src="quiz.js"></script>
</body>
</html>
